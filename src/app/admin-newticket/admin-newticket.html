<div class="details-container">

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="back-arrow" routerLink="/admin-ticketsqueue" routerLinkActive="active">&#8592;</button>
    <h1>RAISE NEW TICKET</h1>
    <div class="admin-btn">ADMIN</div>
  </div>

  <!-- Main Section -->
  <div class="content">

    <!-- Left Box -->
    <div class="info-box">

      <div class="field-group">
        <strong>Title :</strong>
        <input type="text" class="field-input" placeholder="Enter ticket title" />
      </div>

      <div class="field-group">
        <strong>Priority :</strong>
        <div class="radio-options">
          <label class="radio-label high">
            <input type="radio" name="priority" value="High" /> High
          </label>
          <label class="radio-label medium">
            <input type="radio" name="priority" value="Medium" /> Medium
          </label>
          <label class="radio-label low">
            <input type="radio" name="priority" value="Low" /> Low
          </label>
        </div>
      </div>

      <div class="field-group">
        <strong>Status :</strong>
        <div class="radio-options">
          <label class="radio-label open">
            <input type="radio" name="status" value="Open" /> Open
          </label>
          <label class="radio-label closed">
            <input type="radio" name="status" value="Closed" /> Closed
          </label>
          <label class="radio-label inprogress">
            <input type="radio" name="status" value="In Progress" /> In Progress
          </label>
        </div>
      </div>

      <div class="field-group">
        <strong>Owner :</strong>
        <input type="text" class="field-input" placeholder="Assign owner" />
      </div>

    </div>

    <!-- Right Box -->
    <div class="desc-box">
      <h3>Description</h3>
      <textarea placeholder="Enter description..."></textarea>
    </div>

  </div>

  <!-- Comments Section -->
  <div class="comments-box">
    <h3>Comments</h3>
    <div class="comment-input">
      <input type="text" placeholder="Write a Comment" />
      <button>Send</button>
    </div>
    <div class="form-actions">
      <button class="btn-submit" routerLink="/admin-ticketsqueue" routerLinkActive="active">Submit</button>
      <button class="btn-cancel" routerLink="/admin-admin-dashboard" routerLinkActive="active">Cancel</button>
    </div>
  </div>

</div>
