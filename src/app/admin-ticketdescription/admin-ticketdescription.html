<div class="details-container">

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="back-arrow" routerLink="/admin-ticketsqueue" routerLinkActive="active">&#8592;</button>
    <h1>TICKET DESCRIPTION</h1>
    <div class="admin-btn">ADMIN</div>
  </div>

  <!-- Main Section -->
  <div class="content">

    <!-- Left Box -->
    <div class="info-box" *ngIf="ticket">

      <p><strong>Ticket ID :</strong> {{ ticket.id }}</p>

      <div class="field-group">
        <strong>Title :</strong>
        <input type="text" class="field-input" [(ngModel)]="ticket.name" />
      </div>

      <div class="field-group">
        <strong>Priority :</strong>
        <div class="radio-options">
          <label class="radio-label high">
            <input type="radio" name="priority" value="High" [(ngModel)]="ticket.priority" /> High
          </label>
          <label class="radio-label medium">
            <input type="radio" name="priority" value="Medium" [(ngModel)]="ticket.priority" /> Medium
          </label>
          <label class="radio-label low">
            <input type="radio" name="priority" value="Low" [(ngModel)]="ticket.priority" /> Low
          </label>
        </div>
      </div>

      <div class="field-group">
        <strong>Status :</strong>
        <div class="radio-options">
          <label class="radio-label open">
            <input type="radio" name="status" value="Open" [(ngModel)]="ticket.status" /> Open
          </label>
          <label class="radio-label closed">
            <input type="radio" name="status" value="Closed" [(ngModel)]="ticket.status" /> Closed
          </label>
          <label class="radio-label inprogress">
            <input type="radio" name="status" value="In Progress" [(ngModel)]="ticket.status" /> In Progress
          </label>
        </div>
      </div>

      <div class="field-group">
        <strong>Owner :</strong>
        <input type="text" class="field-input" [(ngModel)]="ticket.owner" />
      </div>

    </div>

    <!-- Right Box -->
    <div class="desc-box">
      <h3>Description</h3>
      <textarea placeholder="Enter the description..."></textarea>
    </div>

  </div>

  <!-- Comments Section -->
  <div class="comments-box">
    <h3>Comments</h3>

    <div class="comment-input">
      <input type="text" placeholder="Write a Comment" />
      <button>Send</button>
    </div>
  </div>

</div>
